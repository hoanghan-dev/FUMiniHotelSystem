spring.application.name=A3HanNH_SE1910

# Server Port
server.port=8080

# SQL Server Configuration
# Database named A3StudentName_ClassCode (A3HanNH_SE1910)
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A3HanNH_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Spring Data JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Staff Credentials (not stored in DB, read from application.properties)
app.staff.email=${STAFF_EMAIL:staff@fuminihotel.com}
app.staff.password=${STAFF_PASSWORD:Staff@123}

# JWT Secret & Expiration (256-bit secret)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
